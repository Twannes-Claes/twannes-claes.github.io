<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <!--
            Resolve the theme before first paint so there is no flash of the
            wrong palette. Must stay a blocking inline script in <head>.
        -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('theme');
                    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.setAttribute(
                        'data-theme',
                        stored || (prefersDark ? 'dark' : 'light'),
                    );
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }

                // Pages are built to /projects/<slug>.html, the same path Jekyll used,
                // so old links still resolve. The router only knows the clean URL, so
                // rewrite the address before it boots or hydration would fall through
                // to the 404 route.
                var legacy = location.pathname.match(/^(\/projects\/[^/]+)\.html$/);
                if (legacy) {
                    history.replaceState(null, '', legacy[1] + location.search + location.hash);
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"><!--app-html--></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
